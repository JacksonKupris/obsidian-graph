# The tests: on every pull request (its checks show on the PR before merging) and every push to main, which is the run a
# release checks. A version commit changes only the number, so it starts no run. Failing test lines also go out as
# annotations, which show on the run page.
name: Test
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: [package.json, manifest.json]
# The suite runs in 4 shards side by side (tests/run.js --shard=i/n; test_shards.js checks none is dropped). The workflow
# passes only when every shard does, which is what a release checks.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install the graphs library
        run: npm install
      - name: Test
        run: |
          set -o pipefail
          npm test -- --shard=${{ matrix.shard }}/4 2>&1 | tee test.log || { grep -E "FAIL|Error" test.log | head -20 | sed 's/^/::error::/'; exit 1; }

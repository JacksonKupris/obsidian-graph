# The tests: on every pull request (its checks show on the PR before merging) and every push to main, which is the run a
# release checks. A version commit changes only the number, so it starts no run. Failing test lines also go out as
# annotations, which show on the run page.
name: Test
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: [package.json, manifest.json]
# The suite runs in 4 shards side by side (tests/run.js --shard=i/n; test_shards.js checks none is dropped). The workflow
# passes only when every shard does, which is what a release checks.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install the graphs library
        run: npm install
      - name: Test
        run: |
          set -o pipefail
          npm test -- --shard=${{ matrix.shard }}/4 2>&1 | tee test.log || { grep -E "FAIL|Error" test.log | head -20 | sed 's/^/::error::/'; exit 1; }
  # One name for "the tests passed", which is what a pull request must have before it merges (a branch rule names this check,
  # so the shard count can change without touching the rule).
  tests:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = "success"
  # A merge to main is the release. It needs the shards above, so it runs only on code that passed, and it releases when
  # something that ships changed (scripts/ci_release.js decides; RELEASING.md). One at a time: a second merge waits.
  release:
    if: github.event_name == 'push'
    needs: tests
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install the graphs library
        run: npm install
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci_release.js

# The tests: on every pull request (its checks show on the PR before merging) and every push to main, which is the run a
# release checks. A version commit changes only the number, so it starts no run. Failing test lines also go out as
# annotations, which show on the run page.
name: Test
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: [package.json, manifest.json]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log || { grep -E "FAIL|Error" test.log | head -20 | sed 's/^/::error::/'; exit 1; }

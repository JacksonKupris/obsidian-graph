# A version tag (0.5.0) makes a GitHub release with the files Obsidian and BRAT install, once the tests (test.yml) pass.
# The tag must match package.json's version, which manifest.json carries (node build.js manifest). RELEASING.md.
name: Release
on:
  push:
    tags: ["*"]
permissions:
  contents: write
jobs:
  test:
    uses: ./.github/workflows/test.yml
  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Tag matches the version
        run: test "$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Build
        run: node build.js --out dist
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/main.js dist/manifest.json dist/styles.css --title "$GITHUB_REF_NAME" --generate-notes
